description: Hyperproof is a continuous compliance and risk management platform that automates evidence
  collection, control management, and audit workflows. It exposes a public REST API covering 20+ resources
  (Controls, Policies, Programs, Risks, Proof, Tasks, Issues, Vendors, Users, Groups, Roles, Scopes, Questionnaires,
  Custom Apps, Labels, and more) plus the Hypersync SDK for custom integrations.
